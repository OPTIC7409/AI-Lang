[package]
name = "cogito-web"
version = "0.1.0"
edition = "2021"
description = "The Cogito interpreter compiled to WebAssembly, for the browser playground"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
cogito = { path = ".." }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
