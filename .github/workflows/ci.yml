name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Run the Cogito test suite and examples
        run: |
          cargo build --release
          ./target/release/cogito test tests/lang examples
          ./target/release/cogito check examples
          ./target/release/cogito fmt --check examples tests/lang web/examples
        shell: bash

  wasm:
    name: WebAssembly playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
        working-directory: web
      - name: Clippy
        run: cargo clippy --release -- -D warnings
        working-directory: web
      - name: Build the playground
        run: python3 web/build.py --inline
